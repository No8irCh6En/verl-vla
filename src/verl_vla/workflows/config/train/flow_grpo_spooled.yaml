# @package _global_
# One Flow-GRPO actor update over a closed fragmented collection window.
defaults:
  - /cluster@_global_.cluster: actor_cluster
  - /trainer@_global_.trainer: flow_grpo_trainer
  - /ray@_global_.ray_kwargs: default
  - override /actor@_global_.cluster.actor_rollout_ref.actor: flow_grpo_actor
  - override /model/adapter@_global_.cluster.actor_rollout_ref.model.adapter: fastwam
  - _self_

output_dir: ${oc.env:GRFPO_OUTPUT_ROOT,???}
checkpoint_load_smoke_only: false
checkpoint_portable_export_only: false
# The existing fixed-CFM gradient diagnostic is FPO-specific.
task_gradient_diagnostic_only: false
task_gradient_diagnostic_output: null
task_gradient_diagnostic_targets_json: null
task_gradient_diagnostic_include_groups: true
counterfactual_replay_receipt_path: null

collection:
  collection_root: ${oc.env:GRFPO_COLLECTION_ROOT,???}
  run_id: flow-grpo-multitask5
  intended_update: 1
  rollout_policy_version: 0
  task_names:
    - stack_bowls
    - fold_clothes
    - put_bottles_into_dustbin
    - match_and_pick_from_conveyor
    - classify_objects
  included_task_names: ""
  excluded_task_names: ""
  suite_ids: [0, 1, 2]
  condition_manifest_sha256: ???
  group_reward_source: binary_success
  informative_group_criterion: full_success_mixed
  accepted_group_reduction: group_equal
  policy_seed_namespace: ""
  collector_count: 15
  group_size: 8
  target_accepted_groups: 32
  minimum_accepted_groups: 16
  max_candidate_groups: 96
  complete_round_after_target: false
  drain_candidate_budget: true
  actor_objective: flow_grpo
  flow_grpo_noise_level: 0.01
  model_root: ???
  checkpoint_sha256: ???
  verl_actor_checkpoint: null

cluster:
  actor_rollout_ref:
    model:
      path: ${collection.model_root}
      tokenizer_path: null
      load_tokenizer: false
      native_architecture: fastwam
      adapter:
        policy_root: ${oc.env:FASTWAM_POLICY_ROOT,???}
        checkpoint_sha256: ${collection.checkpoint_sha256}
        fpo:
          enabled: false
          value_enabled: false
        flow_grpo:
          enabled: true
          noise_level: ${collection.flow_grpo_noise_level}
          # Batch adjacent diffusion/flow transitions within each actor
          # microbatch. This is method-specific training compute, not rollout
          # simulator concurrency.
          transition_batch_size: ${oc.decode:${oc.env:GRFPO_FLOW_GRPO_TRANSITION_BATCH_SIZE,3}}
    actor:
      mini_batch_size: 8704
      micro_batch_size: 1
      full_logical_batch_gradient_accumulation: true
      update_epochs: 2
      normalize_advantages: false
      train_transition_fraction: 0.99
      advantage_clip_max: 5.0
      # Flow-GRPO owns its transition-likelihood ratio. FPO++/ASPO is invalid.
      fpo_variant: vanilla
      trust_region_mode: ppo
      clip_coef: 1.0e-3
      vf_coef: 0.0
      value_only_updates: 0
      target_kl: 0.1
      kl_early_stop_mode: post_epoch
      # Common spooled-launcher replay controls. Flow-GRPO does not sample FPO
      # MC noise, but these structured keys allow the shared launcher to pass
      # one fail-closed experiment contract to either actor implementation.
      fpo_mc_seed: null
      fpo_shuffle_seed: null
      post_resume_lr_override: null
      checkpoint:
        save_contents: ["model", "optimizer", "extra"]
        load_contents: ["model", "optimizer", "extra"]
      optim:
        lr: 1.0e-5
        betas: [0.9, 0.99]
        weight_decay: 0.0
        clip_grad: 25.0
        lr_scheduler_type: constant
      value:
        enabled: false
        lr: 1.0e-4
        weight_decay: 0.0
        clip_grad: 25.0
  resource:
    model:
      nnodes: 1
      gpus_per_node: 1
      workers_per_node: 1
      device: cuda
  checkpoint:
    resume_mode: disable
    resume_from_path: null
    default_local_dir: ${output_dir}/checkpoints
    max_actor_ckpt_to_keep: 8

trainer:
  total_training_steps: 1
  group_size: 8
  accepted_groups_per_update: ${collection.target_accepted_groups}
  min_accepted_groups_for_partial_update: ${collection.minimum_accepted_groups}
  max_candidate_groups_per_update: ${collection.max_candidate_groups}
  concurrent_candidate_groups: 1
  informative_group_sampling: true
  advantage_estimator: grpo_outcome
  group_reward_source: ${collection.group_reward_source}
  informative_group_criterion: ${collection.informative_group_criterion}
  accepted_group_reduction: ${collection.accepted_group_reduction}
  save_freq: 1
  test_freq: 0
  val_before_train: false

ray_kwargs:
  ray_init:
    _temp_dir: /tmp/verl-vla-flow-grpo-spooled-ray
